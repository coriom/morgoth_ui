[[permission]]
identifier = "allow-connector-catalog"
description = "Read the fixed local connector catalog."
commands.allow = ["connector_catalog"]

[[permission]]
identifier = "allow-connector-connect"
description = "Authorize the fixed synthetic MCP read-only connector for one bounded session."
commands.allow = ["connector_connect"]

[[permission]]
identifier = "allow-connector-test"
description = "Invoke the fixed harmless read-only MCP fixture tool."
commands.allow = ["connector_test"]

[[permission]]
identifier = "allow-connector-disconnect"
description = "Revoke the local connector session."
commands.allow = ["connector_disconnect"]

[[permission]]
identifier = "allow-windows-detect"
description = "Discover only the fixed D13 Windows test application."
commands.allow = ["windows_detect"]

[[permission]]
identifier = "allow-windows-authorize"
description = "Require native approval for one scoped Windows test-window inspection session."
commands.allow = ["windows_authorize"]

[[permission]]
identifier = "allow-windows-inspect"
description = "Inspect only the two allowlisted Windows test controls."
commands.allow = ["windows_inspect"]

[[permission]]
identifier = "allow-windows-invoke"
description = "Require native approval for one reversible Windows test toggle."
commands.allow = ["windows_invoke"]

[[permission]]
identifier = "allow-windows-disconnect"
description = "Revoke the Windows test-window grant."
commands.allow = ["windows_disconnect"]

[[permission]]
identifier = "allow-connector-catalog"
description = "Read the fixed local connector catalog."
commands.allow = ["connector_catalog"]

[[permission]]
identifier = "allow-connector-connect"
description = "Authorize the fixed synthetic MCP read-only connector for one bounded session."
commands.allow = ["connector_connect"]

[[permission]]
identifier = "allow-connector-test"
description = "Invoke the fixed harmless read-only MCP fixture tool."
commands.allow = ["connector_test"]

[[permission]]
identifier = "allow-connector-disconnect"
description = "Revoke the local connector session."
commands.allow = ["connector_disconnect"]

[[permission]]
identifier = "allow-vscode-status"
description = "Read the fixed VS Code connector state only."
commands.allow = ["vscode_status"]
[[permission]]
identifier = "allow-vscode-pair"
description = "Pair one same-user VS Code extension after native approval."
commands.allow = ["vscode_pair"]
[[permission]]
identifier = "allow-vscode-metadata"
description = "Approve bounded active editor metadata."
commands.allow = ["vscode_metadata"]
[[permission]]
identifier = "allow-vscode-selection"
description = "Approve one bounded selected passage."
commands.allow = ["vscode_selection"]
[[permission]]
identifier = "allow-vscode-scratch"
description = "Approve one fixed unsaved scratch document."
commands.allow = ["vscode_scratch"]
[[permission]]
identifier = "allow-vscode-disconnect"
description = "Revoke the VS Code extension connection."
commands.allow = ["vscode_disconnect"]

[[permission]]
identifier = "allow-windows-detect"
description = "Discover only the fixed D13 Windows test application."
commands.allow = ["windows_detect"]

[[permission]]
identifier = "allow-windows-authorize"
description = "Require native approval for one scoped Windows test-window inspection session."
commands.allow = ["windows_authorize"]

[[permission]]
identifier = "allow-windows-inspect"
description = "Inspect only the two allowlisted Windows test controls."
commands.allow = ["windows_inspect"]

[[permission]]
identifier = "allow-windows-invoke"
description = "Require native approval for one reversible Windows test toggle."
commands.allow = ["windows_invoke"]

[[permission]]
identifier = "allow-windows-disconnect"
description = "Revoke the Windows test-window grant."
commands.allow = ["windows_disconnect"]

[[permission]]
identifier = "allow-browser-status"
description = "Read only the D14 isolated browser session status."
commands.allow = ["browser_status"]
[[permission]]
identifier = "allow-browser-start"
description = "Approve one temporary Chromium session for the fixed local fixture."
commands.allow = ["browser_start"]
[[permission]]
identifier = "allow-browser-navigate"
description = "Navigate only between the two fixed local fixture pages."
commands.allow = ["browser_navigate"]
[[permission]]
identifier = "allow-browser-inspect"
description = "Inspect bounded visible content in the authorized local fixture."
commands.allow = ["browser_inspect"]
[[permission]]
identifier = "allow-browser-fill"
description = "Approve a fixed synthetic value in an inspected fixture field."
commands.allow = ["browser_fill"]
[[permission]]
identifier = "allow-browser-click"
description = "Approve one inspected fixture button action."
commands.allow = ["browser_click"]
[[permission]]
identifier = "allow-browser-disconnect"
description = "Revoke and terminate the owned Chromium session."
commands.allow = ["browser_disconnect"]
